<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title description">
  <title id="title">C4 Level 2 candidate SIS container boundaries</title>
  <desc id="description">Proposed candidate runnable boundaries for the Web Interface, API/Backend and Database containers, with request/response and persistence dependencies. They are candidate application/data-store boundaries, not selected technologies or a physical deployment topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#49677f" />
    </marker>
    <marker id="dashArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6a2b" />
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183247; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #425d72; }
      .actor-title { font-size: 18px; font-weight: 700; }
      .card-title { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #425d72; }
      .edge-label { font-size: 14px; fill: #334f66; }
      .operation { font-size: 13px; fill: #334f66; }
    </style>
  </defs>
  <rect width="1800" height="1240" fill="#f4f7fb" />
  <text class="title" x="48" y="55">C4 Level 2 — SIS candidate container boundaries</text>
  <text class="subtitle" x="48" y="88">Candidate runnable/application and data-store boundaries; technology and physical deployment topology remain Pending.</text>

  <!-- Candidate actors remain outside the conceptual SIS boundary. -->
  <rect x="35" y="255" width="245" height="78" rx="12" fill="#ffffff" stroke="#54738c" stroke-width="2" />
  <text class="actor-title" x="157" y="286" text-anchor="middle">Student</text>
  <text class="small" x="157" y="313" text-anchor="middle">Proposed actor</text>
  <rect x="35" y="365" width="245" height="78" rx="12" fill="#ffffff" stroke="#54738c" stroke-width="2" />
  <text class="actor-title" x="157" y="396" text-anchor="middle">Instructor</text>
  <text class="small" x="157" y="423" text-anchor="middle">Proposed actor</text>
  <rect x="35" y="475" width="245" height="78" rx="12" fill="#ffffff" stroke="#54738c" stroke-width="2" />
  <text class="actor-title" x="157" y="506" text-anchor="middle">Administrators</text>
  <text class="small" x="157" y="533" text-anchor="middle">Proposed actor</text>
  <rect x="35" y="585" width="245" height="78" rx="12" fill="#ffffff" stroke="#54738c" stroke-width="2" />
  <text class="actor-title" x="157" y="616" text-anchor="middle">Student Affairs Staff</text>
  <text class="small" x="157" y="643" text-anchor="middle">Proposed actor</text>
  <text class="small" x="35" y="695">Role-to-operation</text>
  <text class="small" x="35" y="714">permissions Pending.</text>

  <rect x="330" y="150" width="1425" height="1000" rx="26" fill="#eef5fa" stroke="#244f73" stroke-width="4" />
  <rect x="360" y="132" width="480" height="48" rx="10" fill="#dcecf8" stroke="#244f73" stroke-width="2" />
  <text x="380" y="164" font-size="22" font-weight="700" fill="#183247">Student Information System (SIS)</text>
  <text class="small" x="1725" y="120" text-anchor="end">Boundary view is Proposed; deployment form Pending</text>

  <!-- Proposed actor-to-interface interactions; no role permissions are implied. -->
  <path d="M280 294 H355 V340 H440" fill="none" stroke="#49677f" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M280 404 H375 V350 H440" fill="none" stroke="#49677f" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M280 514 H395 V360 H440" fill="none" stroke="#49677f" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M280 624 H415 V370 H440" fill="none" stroke="#49677f" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Candidate UI/API request and response path; transport and server remain unresolved. -->
  <path d="M940 370 H1090" fill="none" stroke="#49677f" stroke-width="3" marker-end="url(#arrow)" />
  <text class="edge-label" x="1015" y="350" text-anchor="middle">REST request (proposed)</text>
  <path d="M1090 410 H940" fill="none" stroke="#49677f" stroke-width="2" marker-end="url(#arrow)" />
  <text class="small" x="1015" y="435" text-anchor="middle">Response data / errors</text>

  <!-- Candidate API persistence dependency; not a database engine or deployment choice. -->
  <path d="M1390 745 V880" fill="none" stroke="#8a6a2b" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#dashArrow)" />
  <text class="edge-label" x="1410" y="817">Candidate read/write dependency</text>

  <rect x="440" y="225" width="500" height="300" rx="18" fill="#ffffff" stroke="#54738c" stroke-width="3" />
  <rect x="440" y="225" width="500" height="55" rx="16" fill="#dcecf8" stroke="#54738c" stroke-width="2" />
  <text class="card-title" x="690" y="261" text-anchor="middle">Web Interface / Frontend</text>
  <text class="small" x="465" y="315">Candidate web-application boundary</text>
  <text class="body" x="465" y="350">• Present candidate SIS views and input forms</text>
  <text class="body" x="465" y="382">• Submit user actions to the API contract</text>
  <text class="body" x="465" y="414">• Present returned data, errors, and states</text>
  <text class="small" x="465" y="460">No UI implementation is asserted; UX flows/Figma and</text>
  <text class="small" x="465" y="483">accessibility requirements remain Pending.</text>
  <text class="small" x="465" y="511">Candidate runnable unit; framework/deployment Pending.</text>

  <rect x="1090" y="225" width="600" height="520" rx="18" fill="#ffffff" stroke="#244f73" stroke-width="3" />
  <rect x="1090" y="225" width="600" height="55" rx="16" fill="#dcecf8" stroke="#244f73" stroke-width="2" />
  <text class="card-title" x="1390" y="261" text-anchor="middle">API / Backend</text>
  <text class="small" x="1115" y="310">Candidate API-application boundary; no running server asserted.</text>
  <text class="body" x="1115" y="345">• Expose the provisional API contract and coordinate</text>
  <text class="body" x="1134" y="370">candidate validation, authorization, and domain behavior</text>
  <text class="small" x="1115" y="408">Operation IDs in api/openapi.yaml (all provisional):</text>
  <text class="operation" x="1115" y="435">createSession · deleteCurrentSession</text>
  <text class="operation" x="1115" y="458">listStudents · createStudent · updateStudent</text>
  <text class="operation" x="1115" y="481">listCourses · createCourse · updateCourse</text>
  <text class="operation" x="1115" y="504">listMyRegistrations · createRegistration</text>
  <text class="operation" x="1115" y="527">recordGrade · listMyPublishedGrades</text>
  <text class="small" x="1115" y="566">APPROVED: JWT Bearer `sid` links to a server-side session;</text>
  <text class="small" x="1115" y="589">logout invalidates it; its tokens must then be rejected.</text>
  <text class="small" x="1115" y="623">Expiry duration OPEN. OpenAPI currently returns only</text>
  <text class="small" x="1115" y="646">sessionId; token/claim response mapping is incomplete.</text>
  <text class="small" x="1115" y="670">Role/record permissions and error semantics remain Pending.</text>
  <text class="small" x="1115" y="690">Candidate runnable unit; language/framework/deployment Pending.</text>

  <rect x="1090" y="880" width="600" height="180" rx="18" fill="#fffaf0" stroke="#a17a2d" stroke-width="3" stroke-dasharray="10 6" />
  <rect x="1090" y="880" width="600" height="55" rx="16" fill="#fff0c9" stroke="#a17a2d" stroke-width="2" />
  <text class="card-title" x="1390" y="916" text-anchor="middle">Database</text>
  <text class="small" x="1115" y="970">Candidate database/data-store boundary; product and engine Pending.</text>
  <text class="body" x="1115" y="1002">Candidate account/session, student, course/offering/term,</text>
  <text class="body" x="1115" y="1027">registration, and grade data; physical schema/keys Pending.</text>
  <text class="small" x="1115" y="1050">No database engine, server, or deployment choice is implied.</text>

  <rect x="390" y="780" width="610" height="165" rx="14" fill="#fff5dc" stroke="#a17a2d" stroke-width="2" />
  <text class="body" x="695" y="815" text-anchor="middle">Unresolved architecture decisions</text>
  <text class="small" x="415" y="848">• Logical split does not select process/service boundaries.</text>
  <text class="small" x="415" y="873">• Auth/session, permission policy, persistence model,</text>
  <text class="small" x="430" y="896">transport, hosting, and deployment all remain Pending.</text>
  <text class="small" x="415" y="925">• FR-06 later instructor grade retrieval has no mapped API operation.</text>

  <rect x="390" y="985" width="610" height="82" rx="12" fill="#f7f9fb" stroke="#c6d2dc" />
  <text class="small" x="410" y="1018">Solid: proposed actor/UI/API interaction. Dashed: candidate</text>
  <text class="small" x="410" y="1042">persistence dependency. No live system is asserted to exist.</text>

  <text class="small" x="48" y="1195">Container boundaries are Proposed candidate runnable units; physical deployment, products, actors' permissions and API behavior remain Pending.</text>
</svg>
