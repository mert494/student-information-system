openapi: 3.1.0
info:
  title: Student Information System API
  version: 0.1.0-draft
  summary: Proposed API contract for Sprint 1 review
  license:
    name: MIT
    identifier: MIT
  description: |
    This is a provisional draft, not an approved contract. OpenAPI 3.1.0 is a
    candidate format, not a team decision. PB-01 through PB-07 are examples
    awaiting Product Owner approval; operations and fields are illustrative,
    not approved requirements. Scope, domain rules, roles, authentication,
    authorization, server URL, and deployment status remain unresolved. No
    API server is asserted to exist, and missing security configuration must
    not be interpreted as public access. Resolve requirements and security
    decisions before adopting or publishing this contract.
x-draft-status: proposed
x-not-ready-for-consumption: true
x-not-ready-for-consumption-description: >-
  Informational draft marker only; it is not enforced by OpenAPI tooling and
  does not provide or enforce security.
x-openapi-version-status: candidate-not-team-approved
x-license-status: "proposed: repository LICENSE is MIT; team confirmation pending"
x-issue: "[TODO]"
servers:
  - url: http://localhost:8080
    description: Local development (placeholder, proposed)
x-servers-status: "proposed: local placeholder only; no deployed server"
x-security-status: "proposed: bearer token; policy pending team approval"
tags:
  - name: Sessions
    description: Proposed grouping for illustrative PB-01 session operations; not an approved API commitment.
  - name: Students
    description: Proposed grouping for illustrative PB-03 student operations; fields and permissions require approval.
  - name: Courses
    description: Proposed grouping for illustrative PB-04 course operations; fields and permissions require approval.
  - name: Registrations
    description: Proposed grouping for illustrative PB-05 registration operations; rules and permissions require approval.
  - name: Grades
    description: Proposed grouping for illustrative PB-06/PB-07 grade operations; grade representation and permissions require approval.
security:
  - bearerAuth: []
paths:
  /sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      security: []
      summary: Proposed sign-in operation (PB-01 example)
      description: Illustrative only; credential fields and session behavior require confirmation.
      x-requirement-status: proposed-example
      x-backlog-reference: PB-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Proposed successful sign-in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                illustrative:
                  summary: Synthetic illustrative response only
                  value:
                    sessionId: example-session-id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [Sessions]
      summary: Proposed sign-out operation (PB-01 example)
      description: Illustrative only; session identification and termination semantics are unresolved.
      x-requirement-status: proposed-example
      x-backlog-reference: PB-01
      responses:
        '204':
          description: Proposed successful sign-out with no response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /students:
    get:
      operationId: listStudents
      tags: [Students]
      summary: Proposed student listing operation (PB-03 example)
      description: Illustrative only; permissions, filtering, pagination, and student fields are unresolved.
      x-requirement-status: proposed-example
      x-backlog-reference: PB-03
      responses:
        '200':
          description: Proposed collection response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
              examples:
                illustrative:
                  summary: Synthetic illustrative response only
                  value:
                    - studentNumber: example-student-number
                      studentId: example-student-id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createStudent
      tags: [Students]
      summary: Proposed student creation operation (PB-03 example)
      description: Illustrative only; PB-03 mentions duplicate student numbers, but the complete model and rules are unresolved.
      x-requirement-status: proposed-example
      x-backlog-reference: PB-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '201':
          description: Proposed student created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
              examples:
                illustrative:
                  summary: Synthetic illustrative response only
                  value:
                    studentNumber: example-student-number
                    studentId: example-student-id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    patch:
      operationId: updateStudent
      tags: [Students]
      summary: Proposed student update operation (PB-03 example)
      description: Illustrative only; updatable fields and partial-update semantics are unresolved.
      x-requirement-status: proposed-example
      x-backlog-reference: PB-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '200':
          description: Proposed updated student representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
              examples:
                illustrative:
                  summary: Synthetic illustrative response only
                  value:
                    studentNumber: example-student-number
                    studentId: example-student-id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /courses:
