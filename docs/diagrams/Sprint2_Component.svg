<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1360" viewBox="0 0 2000 1360" role="img" aria-labelledby="title description">
  <title id="title">C4 Level 3 — candidate components inside the API/Backend container</title>
  <desc id="description">A technology-neutral component view scoped to the proposed API/Backend container. External Web Interface and Database boundaries are shown only as dependencies. Authorization gates domain operations; Grade Management calls Enrollment to resolve a Registration parent. All components and connections are proposed and unimplemented.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#365f7c"/></marker>
    <marker id="dataArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#80621b"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183247; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #40596d; }
      .boundary { font-size: 22px; font-weight: 700; }
      .card-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 13px; fill: #354f63; }
      .edge { font-size: 13px; font-weight: 600; fill: #29485f; }
      .note { font-size: 14px; }
    </style>
  </defs>
  <rect width="2000" height="1360" fill="#f4f7fb"/>
  <text id="heading" class="title" x="42" y="52">C4 Level 3 — API/Backend component view</text>
  <text class="subtitle" x="42" y="82">Scope is inside the proposed API/Backend container. Web Interface and Database are external container dependencies.</text>
  <rect x="38" y="245" width="260" height="150" rx="14" fill="#ffffff" stroke="#54738c" stroke-width="2"/>
  <text class="card-title" x="168" y="280" text-anchor="middle">Web Interface</text>
  <text class="small" x="168" y="307" text-anchor="middle">Candidate container</text>
  <text class="small" x="58" y="340">Sends API requests;</text>
  <text class="small" x="58" y="361">renders response/error states.</text>
  <text class="small" x="38" y="425">Shared-env HTTPS target proposed</text>
  <text class="small" x="38" y="444">by NFR-SEC-05; transport Pending.</text>
  <rect x="1655" y="930" width="300" height="180" rx="14" fill="#fff8e8" stroke="#80621b" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="card-title" x="1805" y="968" text-anchor="middle">Database</text>
  <text class="small" x="1805" y="994" text-anchor="middle">Candidate container boundary</text>
  <text class="small" x="1678" y="1031">Engine, schema, hosting,</text>
  <text class="small" x="1678" y="1053">constraints and deployment</text>
  <text class="small" x="1678" y="1075">mechanism all Pending.</text>
  <rect x="330" y="145" width="1290" height="1080" rx="25" fill="#edf4f8" stroke="#234e6e" stroke-width="4"/>
  <rect x="360" y="125" width="760" height="48" rx="9" fill="#dcecf8" stroke="#234e6e" stroke-width="2"/>
  <text class="boundary" x="382" y="157">Proposed API/Backend container — component scope</text>
  <text class="small" x="1585" y="130" text-anchor="end">Candidate boundary; implementation/topology Pending</text>

  <path d="M298 320 H400" fill="none" stroke="#365f7c" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="edge" x="350" y="302" text-anchor="middle">REST request</text>
  <path d="M700 330 H750" fill="none" stroke="#365f7c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="small" x="725" y="211" text-anchor="middle">Session operations</text>
  <path d="M700 438 V480 H1355 V445" fill="none" stroke="#365f7c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="edge" x="1025" y="472" text-anchor="middle">Protected operation → authorization decision</text>
  <path d="M1140 335 H1090" fill="none" stroke="#365f7c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="small" x="1115" y="211" text-anchor="middle">Validate session ID (sid)</text>
  <path d="M1395 445 V520" fill="none" stroke="#365f7c" stroke-width="2.5"/>
  <path d="M525 520 H1430" fill="none" stroke="#365f7c" stroke-width="2.5"/>
  <path d="M525 520 V555" fill="none" stroke="#365f7c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M805 520 V555" fill="none" stroke="#365f7c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1095 520 V555" fill="none" stroke="#365f7c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1430 520 V555" fill="none" stroke="#365f7c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="edge" x="970" y="512" text-anchor="middle">Dispatch to one requested domain component only after authorization allows</text>

  <path d="M525 750 V835 H700 V905" fill="none" stroke="#80621b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#dataArrow)"/>
  <path d="M805 750 V905" fill="none" stroke="#80621b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#dataArrow)"/>
  <path d="M1095 755 V905" fill="none" stroke="#80621b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#dataArrow)"/>
  <path d="M1430 755 V835 H1230 V905" fill="none" stroke="#80621b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#dataArrow)"/>
  <text class="edge" x="960" y="865" text-anchor="middle">Candidate repository/data-access calls</text>
  <path d="M1350 1005 H1655" fill="none" stroke="#80621b" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#dataArrow)"/>
  <text class="edge" x="1500" y="987" text-anchor="middle">Persistence interface (proposed)</text>
  <path d="M1290 725 H1230" fill="none" stroke="#80621b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#dataArrow)"/>
  <text class="small" x="1260" y="785" text-anchor="middle">Grade Management → Enrollment: Registration lookup</text>

  <rect x="400" y="220" width="300" height="225" rx="14" fill="#ffffff" stroke="#365f7c" stroke-width="2"/>
  <rect x="400" y="220" width="300" height="48" rx="12" fill="#dcecf8" stroke="#365f7c" stroke-width="2"/>
  <text class="card-title" x="550" y="251" text-anchor="middle">API operation router</text>
  <text class="small" x="420" y="291">Routes current contract operations;</text>
  <text class="small" x="420" y="313">returns declared responses/errors.</text>
  <text class="small" x="420" y="351">No new route is represented as current.</text>
  <text class="small" x="420" y="383">Public: createSession.</text>
  <text class="small" x="420" y="405">Protected routing follows the</text>
  <text class="small" x="420" y="427">authorization decision (Pending rules).</text>

  <rect x="750" y="220" width="340" height="225" rx="14" fill="#ffffff" stroke="#365f7c" stroke-width="2"/>
  <rect x="750" y="220" width="340" height="48" rx="12" fill="#dcecf8" stroke="#365f7c" stroke-width="2"/>
  <text class="card-title" x="920" y="251" text-anchor="middle">Identity and session</text>
  <text class="small" x="770" y="291">createSession; deleteCurrentSession</text>
  <text class="small" x="770" y="317">PD-01: JWT sid references server session;</text>
  <text class="small" x="770" y="339">logout revokes it (approved behavior).</text>
  <text class="small" x="770" y="371">Expiry/provider/response mapping Pending.</text>
  <text class="small" x="770" y="401">SEC-03 generic login error (Proposed);</text>
  <text class="small" x="770" y="423">SEC-04 hash algorithm (Open).</text>

  <rect x="1140" y="220" width="430" height="225" rx="14" fill="#fff8e8" stroke="#80621b" stroke-width="2"/>
  <rect x="1140" y="220" width="430" height="48" rx="12" fill="#f5e9c9" stroke="#80621b" stroke-width="2"/>
  <text class="card-title" x="1355" y="251" text-anchor="middle">Authorization decision</text>
  <text class="small" x="1160" y="291">Validate session status; check operation,</text>
  <text class="small" x="1160" y="313">role and record scope before domain calls.</text>
  <text class="small" x="1160" y="345">SEC-01/02 control point (proposed).</text>
  <text class="small" x="1160" y="377">No role-permission matrix is approved here.</text>
  <text class="small" x="1160" y="407">Deny: return expected 401/403; stop before</text>
  <text class="small" x="1160" y="429">domain query/write (policy mapping Pending).</text>

  <rect x="400" y="555" width="250" height="195" rx="14" fill="#ffffff" stroke="#54738c" stroke-width="2"/>
  <rect x="400" y="555" width="250" height="46" rx="12" fill="#dcecf8" stroke="#54738c" stroke-width="2"/>
  <text class="card-title" x="525" y="585" text-anchor="middle">Student information</text>
  <text class="small" x="420" y="626">listStudents</text><text class="small" x="420" y="648">createStudent</text><text class="small" x="420" y="670">updateStudent</text>
  <text class="small" x="420" y="710">Field/permission rules Pending.</text>

  <rect x="680" y="555" width="250" height="195" rx="14" fill="#ffffff" stroke="#54738c" stroke-width="2"/>
  <rect x="680" y="555" width="250" height="46" rx="12" fill="#dcecf8" stroke="#54738c" stroke-width="2"/>
  <text class="card-title" x="805" y="585" text-anchor="middle">Course catalog</text>
  <text class="small" x="700" y="626">listCourses</text><text class="small" x="700" y="648">createCourse</text><text class="small" x="700" y="670">updateCourse</text>
  <text class="small" x="700" y="710">CourseOffering API mapping Pending.</text>

  <rect x="950" y="555" width="280" height="200" rx="14" fill="#ffffff" stroke="#54738c" stroke-width="2"/>
  <rect x="950" y="555" width="280" height="46" rx="12" fill="#dcecf8" stroke="#54738c" stroke-width="2"/>
  <text class="card-title" x="1090" y="585" text-anchor="middle">Enrollment</text>
  <text class="small" x="970" y="626">listMyRegistrations</text><text class="small" x="970" y="648">createRegistration</text>
  <text class="small" x="970" y="680">Approved duplicate key: studentId +</text>
  <text class="small" x="970" y="702">courseOfferingId (PD-03); API mismatch.</text>
  <text class="small" x="970" y="730">Capacity/waitlist rules Pending.</text>

  <rect x="1290" y="555" width="280" height="200" rx="14" fill="#ffffff" stroke="#54738c" stroke-width="2"/>
  <rect x="1290" y="555" width="280" height="46" rx="12" fill="#dcecf8" stroke="#54738c" stroke-width="2"/>
  <text class="card-title" x="1430" y="585" text-anchor="middle">Grade management</text>
  <text class="small" x="1310" y="626">recordGrade; listMyPublishedGrades</text>
  <text class="small" x="1310" y="648">FR-06 Instructor GET capability required;</text>
  <text class="small" x="1310" y="670">path and scope Pending (FR-06).</text>
  <text class="small" x="1310" y="700">Calls Enrollment to resolve the</text>
  <text class="small" x="1310" y="722">Registration parent only; rules Pending.</text>
  <text class="small" x="1310" y="744">FR-07 published-only is draft SRS intent.</text>

  <rect x="700" y="905" width="650" height="195" rx="14" fill="#fff8e8" stroke="#80621b" stroke-width="2"/>
  <rect x="700" y="905" width="650" height="48" rx="12" fill="#f5e9c9" stroke="#80621b" stroke-width="2"/>
  <text class="card-title" x="1025" y="936" text-anchor="middle">Persistence adapter / repository</text>
  <text class="small" x="725" y="980">Technology-neutral component that mediates logical record reads/writes to Database.</text>
  <text class="small" x="725" y="1010">DATA-01: no partial rejected writes; DATA-02: capacity + duplicate invariants.</text>
  <text class="small" x="725" y="1040">Mechanism, schema, transactions and DB product Pending; verification not performed.</text>
  <text class="small" x="725" y="1070">PERF-01/02 measurement path crosses API + Database (targets remain Proposed).</text>

  <rect x="360" y="1140" width="1225" height="55" rx="9" fill="#fff8e8" stroke="#80621b"/>
  <text class="note" x="380" y="1164">All components and arrows are Proposed architecture. No role grants, services, technologies,</text>
  <text class="note" x="380" y="1186">persistence mechanism, tests or deployment choices are asserted as implemented/approved.</text>
</svg>
