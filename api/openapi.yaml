components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Proposed; authentication policy pending team approval.
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      description: Proposed student identifier; format is unresolved.
      x-requirements-owner-approval: pending
      schema:
        type: string
    CourseId:
      name: courseId
      in: path
      required: true
      description: Proposed course identifier; format is unresolved.
      x-requirements-owner-approval: pending
      schema:
        type: string
    RegistrationId:
      name: registrationId
      in: path
      required: true
      description: Proposed registration identifier; format is unresolved.
      x-requirements-owner-approval: pending
      schema:
        type: string
  schemas:
    SignInRequest:
      type: object
      description: Proposed credential shape; authentication policy is unresolved.
      properties:
        username:
          type: string
          description: Illustrative proposed account identifier; exact field is [TODO] and requires requirements-owner approval.
          x-requirements-owner-approval: pending
        password:
          type: string
          format: password
          description: Illustrative proposed secret input; credential mechanism is [TODO] and requires requirements-owner approval.
          x-requirements-owner-approval: pending
      required: [username, password]
    SessionResponse:
      type: object
      description: Proposed placeholder response; session representation is [TODO].
      properties:
        sessionId:
          type: string
          description: Illustrative proposed opaque session reference; mechanism is [TODO] and requires requirements-owner approval.
          x-requirements-owner-approval: pending
      required: [sessionId]
    StudentInput:
      type: object
      description: Provisional minimal shape. PB-03 mentions student-number uniqueness; all other fields and requiredness are [TODO].
      x-requirements-owner-approval: pending
      properties:
        studentNumber:
          type: string
          description: Illustrative candidate inferred from PB-03; field definition and approval by the requirements owner are [TODO].
          x-requirements-owner-approval: pending
        fullName:
          description: Illustrative candidate field; JSON type, definition, and requirements-owner approval are [TODO].
          x-requirements-owner-approval: pending
    Student:
      x-requirements-owner-approval: pending
      allOf:
        - $ref: '#/components/schemas/StudentInput'
        - type: object
          properties:
            studentId:
              type: string
              description: Illustrative proposed resource identifier; format and requirements-owner approval are [TODO].
              x-requirements-owner-approval: pending
          required: [studentId]
    CourseInput:
      type: object
      description: Provisional minimal shape. PB-04 mentions course-code uniqueness; all other fields and requiredness are [TODO].
      x-requirements-owner-approval: pending
      properties:
        courseCode:
          type: string
          description: Illustrative candidate inferred from PB-04; field definition and approval by the requirements owner are [TODO].
          x-requirements-owner-approval: pending
        title:
          description: Illustrative candidate field; JSON type, definition, and requirements-owner approval are [TODO].
          x-requirements-owner-approval: pending
        credits:
          description: Illustrative candidate field; JSON type, units, meaning, and requirements-owner approval are [TODO].
          x-requirements-owner-approval: pending
    Course:
      x-requirements-owner-approval: pending
      allOf:
        - $ref: '#/components/schemas/CourseInput'
        - type: object
          properties:
            courseId:
              type: string
              description: Illustrative proposed resource identifier; format and requirements-owner approval are [TODO].
              x-requirements-owner-approval: pending
          required: [courseId]
    RegistrationInput:
      type: object
      description: Proposed minimal reference shape; student identity and term handling are unresolved.
      x-requirements-owner-approval: pending
      properties:
        courseId:
          type: string
          description: Illustrative candidate course reference inferred from PB-05; definition and requirements-owner approval are [TODO].
