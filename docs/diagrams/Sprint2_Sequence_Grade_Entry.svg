<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1320" viewBox="0 0 1650 1320" role="img" aria-labelledby="title description">
  <title id="title">UML sequence — proposed instructor grade entry</title>
  <desc id="description">The grade-entry sequence uses an authorization alt fragment. Registration lookup, grade validation and persistence appear only in the Allow operand. The Deny operand returns 401/403 and terminates before any domain query or persistence. Role and assignment rules remain Pending; no behavior is implemented or tested.</desc>
  <defs>
    <marker id="msg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#49677f" /></marker>
    <marker id="reply" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6a2b" /></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183247; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #425d72; }
      .part { font-size: 16px; font-weight: 700; }
      .msg { font-size: 14px; }
      .frame { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; fill: #425d72; }
    </style>
  </defs>
  <rect width="1650" height="1320" fill="#f4f7fb" />
  <text class="title" x="42" y="50">UML Sequence — Instructor grade entry (FR-06 / PB-06 proposed)</text>
  <text class="subtitle" x="42" y="80">Grade belongs to Registration via registrationId (Approved); later Instructor retrieval remains uncontracted.</text>

  <g stroke="#a9bac7" stroke-width="2" stroke-dasharray="7 6">
    <path d="M160 200 V1285" /><path d="M480 200 V1285" /><path d="M800 200 V1285" /><path d="M1120 200 V1285" /><path d="M1440 200 V1285" />
  </g>
  <g>
    <rect x="45" y="115" width="230" height="85" rx="12" fill="#ffffff" stroke="#54738c" stroke-width="2" />
    <text class="part" x="160" y="149" text-anchor="middle">Instructor</text><text class="small" x="160" y="176" text-anchor="middle">Proposed actor</text>
    <rect x="365" y="115" width="230" height="85" rx="12" fill="#dcecf8" stroke="#244f73" stroke-width="2" />
    <text class="part" x="480" y="149" text-anchor="middle">API contract boundary</text><text class="small" x="480" y="176" text-anchor="middle">No running API asserted</text>
    <rect x="685" y="115" width="230" height="85" rx="12" fill="#fff5dc" stroke="#a17a2d" stroke-width="2" />
    <text class="part" x="800" y="149" text-anchor="middle">Authorization decision</text><text class="small" x="800" y="176" text-anchor="middle">Assignment matrix Pending</text>
    <rect x="1005" y="115" width="230" height="85" rx="12" fill="#ffffff" stroke="#54738c" stroke-width="2" />
    <text class="part" x="1120" y="149" text-anchor="middle">Grade management</text><text class="small" x="1120" y="176" text-anchor="middle">Logical responsibility</text>
    <rect x="1325" y="115" width="230" height="85" rx="12" fill="#ffffff" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="8 5" />
    <text class="part" x="1440" y="149" text-anchor="middle">Conceptual data</text><text class="small" x="1440" y="176" text-anchor="middle">Persistence Pending</text>
  </g>

  <path d="M160 260 H480" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="320" y="248" text-anchor="middle">1. PUT /registrations/{registrationId}/grade</text>
  <path d="M480 310 H800" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="640" y="298" text-anchor="middle">2. authenticate; evaluate role and course assignment</text>
  <path d="M800 350 H480" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="640" y="338" text-anchor="middle">3. authorization outcome [policy Pending]</text>

  <rect x="80" y="370" width="1500" height="830" fill="#ffffff" stroke="#244f73" stroke-width="2.5" />
  <text class="frame" x="98" y="398">alt — authorization outcome (role / assignment policy Pending)</text>
  <path d="M80 900 H1580" stroke="#244f73" stroke-width="2" />
  <rect x="82" y="404" width="1496" height="494" fill="#f0f8f2" />
  <text class="frame" x="102" y="432">[Allow: authenticated and authorized]</text>
  <text class="small" x="102" y="460">Only this operand contains Registration queries, validation, or persistence.</text>
  <path d="M480 505 H1120" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="800" y="493" text-anchor="middle">4. submit GradeInput (JSON type, scale and range Pending)</text>
  <path d="M1120 550 H1440" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="1280" y="538" text-anchor="middle">5. resolve Registration by registrationId</text>
  <path d="M1440 595 H1120" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="1280" y="583" text-anchor="middle">6. check candidate relationship/value constraints [TODO]</text>
  <rect x="105" y="615" width="1450" height="260" fill="#ffffff" stroke="#54738c" stroke-width="1.5" />
  <text class="small" x="120" y="640">alt — validation result (business rules and exact status mapping Pending)</text>
  <path d="M105 755 H1555" stroke="#c6d2dc" stroke-width="1.5" />
  <text class="small" x="122" y="675">[Valid value and approved relationship]</text>
  <path d="M1120 710 H1440" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="1280" y="698" text-anchor="middle">persist Grade; mechanism Pending</text>
  <path d="M1120 742 H480" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="small" x="800" y="738" text-anchor="middle">200 Grade response (proposed)</text>
  <text class="small" x="122" y="785">[Invalid value / relationship]</text>
  <path d="M1120 825 H480" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="small" x="800" y="820" text-anchor="middle">400 / 404; reject without write (mapping Pending)</text>

  <rect x="82" y="902" width="1496" height="296" fill="#fff7f3" />
  <text class="frame" x="102" y="932">[Deny: unauthenticated or not authorized]</text>
  <path d="M480 975 H160" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="320" y="963" text-anchor="middle">7. return 401 / 403 response</text>
  <text class="small" x="102" y="1008">No Registration lookup, grade query, or persistence step occurs in this operand.</text>
  <rect x="102" y="1030" width="1450" height="125" fill="#fff1ed" stroke="#b64b3c" stroke-width="1.5" />
  <text class="small" x="122" y="1063">break [denied] — this request terminates before any domain/data operation.</text>
  <text class="small" x="122" y="1092">No role or course-assignment permission is inferred by this diagram.</text>

  <rect x="80" y="1220" width="1500" height="72" fill="#fff5dc" stroke="#a17a2d" />
  <text class="small" x="100" y="1249">FR-06 Instructor GET capability is approved, but route, response and access scope remain Pending.</text>
  <text class="small" x="100" y="1273">Recommended path only: GET /course-offerings/{courseOfferingId}/grades; it is not in OpenAPI.</text>
</svg>
