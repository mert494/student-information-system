<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1640" viewBox="0 0 1650 1640" role="img" aria-labelledby="title description">
  <title id="title">UML sequence — proposed course enrollment</title>
  <desc id="description">POST /registrations and a separate GET /registrations each use an authorization alt fragment. Domain and data steps occur only inside the Allow operand. The Deny operand returns 401/403 and ends in a break before protected data operations. The role matrix is Pending. The current OpenAPI still accepts courseId only, while the approved model links Registration to Student and CourseOffering.</desc>
  <defs>
    <marker id="msg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#49677f" /></marker>
    <marker id="reply" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6a2b" /></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183247; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #425d72; }
      .part { font-size: 16px; font-weight: 700; }
      .msg { font-size: 14px; }
      .frame { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; fill: #425d72; }
    </style>
  </defs>
  <rect width="1650" height="1640" fill="#f4f7fb" />
  <text class="title" x="42" y="50">UML Sequence — Student course enrollment (FR-05 / PB-05 proposed)</text>
  <text class="subtitle" x="42" y="80">Approved model: one Student + one CourseOffering per Registration; current request schema mismatch is called out below.</text>

  <g stroke="#a9bac7" stroke-width="2" stroke-dasharray="7 6">
    <path d="M160 200 V1595" /><path d="M480 200 V1595" /><path d="M800 200 V1595" /><path d="M1120 200 V1595" /><path d="M1440 200 V1595" />
  </g>
  <g>
    <rect x="45" y="115" width="230" height="85" rx="12" fill="#ffffff" stroke="#54738c" stroke-width="2" />
    <text class="part" x="160" y="149" text-anchor="middle">Student</text><text class="small" x="160" y="176" text-anchor="middle">Proposed actor</text>
    <rect x="365" y="115" width="230" height="85" rx="12" fill="#dcecf8" stroke="#244f73" stroke-width="2" />
    <text class="part" x="480" y="149" text-anchor="middle">API contract boundary</text><text class="small" x="480" y="176" text-anchor="middle">No running API asserted</text>
    <rect x="685" y="115" width="230" height="85" rx="12" fill="#fff5dc" stroke="#a17a2d" stroke-width="2" />
    <text class="part" x="800" y="149" text-anchor="middle">Authorization decision</text><text class="small" x="800" y="176" text-anchor="middle">Role matrix Pending</text>
    <rect x="1005" y="115" width="230" height="85" rx="12" fill="#ffffff" stroke="#54738c" stroke-width="2" />
    <text class="part" x="1120" y="149" text-anchor="middle">Enrollment responsibility</text><text class="small" x="1120" y="176" text-anchor="middle">Logical component proposal</text>
    <rect x="1325" y="115" width="230" height="85" rx="12" fill="#ffffff" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="8 5" />
    <text class="part" x="1440" y="149" text-anchor="middle">Conceptual data</text><text class="small" x="1440" y="176" text-anchor="middle">No store/engine selected</text>
  </g>

  <text class="small" x="42" y="228">CREATE REGISTRATION — proposed request and logical data mapping.</text>
  <path d="M160 270 H480" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="320" y="258" text-anchor="middle">1. POST /registrations (proposed courseOfferingId)</text>
  <path d="M480 315 H800" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="640" y="303" text-anchor="middle">2. authenticate; evaluate role/record matrix</text>
  <path d="M800 355 H480" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="640" y="343" text-anchor="middle">3. authorization outcome [policy Pending]</text>

  <rect x="80" y="375" width="1500" height="650" fill="#ffffff" stroke="#244f73" stroke-width="2.5" />
  <text class="frame" x="98" y="402">alt — authorization outcome (role/record permission matrix Pending)</text>
  <path d="M80 735 H1580" stroke="#244f73" stroke-width="2" />
  <rect x="82" y="408" width="1496" height="325" fill="#f0f8f2" />
  <text class="frame" x="102" y="433">[Allow: authenticated and authorized]</text>
  <path d="M480 470 H1120" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="800" y="458" text-anchor="middle">4. submit candidate registration request</text>
  <path d="M1120 510 H1440" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="1280" y="498" text-anchor="middle">5. resolve caller Student + CourseOffering</text>
  <path d="M1440 550 H1120" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="1280" y="538" text-anchor="middle">6. verify approved duplicate pair (studentId, courseOfferingId)</text>
  <path d="M1120 580 H1440" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="small" x="1280" y="568" text-anchor="middle">7. create Registration for a unique pair; mechanism Pending</text>
  <path d="M1120 620 H480" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="small" x="800" y="608" text-anchor="middle">201 on create; proposed 409 for duplicate pair</text>
  <text class="small" x="102" y="660">Duplicate pair causes no write; other eligibility/capacity rules remain Pending.</text>

  <rect x="82" y="737" width="1496" height="286" fill="#fff7f3" />
  <text class="frame" x="102" y="765">[Deny: unauthenticated or not authorized]</text>
  <path d="M480 805 H160" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="320" y="793" text-anchor="middle">7. return 401 / 403 response</text>
  <text class="small" x="102" y="838">No Registration lookup, domain query, or persistence step occurs in this operand.</text>
  <rect x="102" y="860" width="1450" height="118" fill="#fff1ed" stroke="#b64b3c" stroke-width="1.5" />
  <text class="small" x="122" y="890">break [denied] — terminate this request before any domain/data operation.</text>
  <text class="small" x="122" y="920">The Allow operand above is the only branch containing enrollment work.</text>

  <text class="small" x="42" y="1065">SEPARATE LIST REQUEST — GET /registrations has its own authorization decision.</text>
  <path d="M160 1105 H480" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="320" y="1093" text-anchor="middle">8. GET /registrations</text>
  <path d="M480 1150 H800" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="640" y="1138" text-anchor="middle">9. authenticate; evaluate own-record access</text>
  <path d="M800 1195 H480" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="640" y="1183" text-anchor="middle">10. authorization outcome [policy Pending]</text>

  <rect x="80" y="1215" width="1500" height="330" fill="#ffffff" stroke="#244f73" stroke-width="2.5" />
  <text class="frame" x="98" y="1242">alt — list authorization outcome (own-record policy Pending)</text>
  <path d="M80 1380 H1580" stroke="#244f73" stroke-width="2" />
  <rect x="82" y="1248" width="1496" height="130" fill="#f0f8f2" />
  <text class="frame" x="102" y="1277">[Allow: authenticated and authorized]</text>
  <path d="M480 1315 H1120" stroke="#49677f" stroke-width="2.5" marker-end="url(#msg)" />
  <text class="msg" x="800" y="1303" text-anchor="middle">11. query candidate registration records</text>
  <path d="M480 1355 H160" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="320" y="1343" text-anchor="middle">200 Registration[]; own-data filter Pending</text>
  <rect x="82" y="1382" width="1496" height="161" fill="#fff7f3" />
  <text class="frame" x="102" y="1410">[Deny: unauthenticated or not authorized]</text>
  <path d="M480 1450 H160" stroke="#8a6a2b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#reply)" />
  <text class="msg" x="320" y="1438" text-anchor="middle">401 / 403 response</text>
  <text class="small" x="102" y="1480">break [denied] — no registration data query occurs.</text>
  <text class="small" x="102" y="1510">Contract mismatch: RegistrationInput requires courseId; approved model requires CourseOffering.</text>
  <text class="small" x="42" y="1580">No role or own-record permission is inferred; CourseOffering/Term API mapping remains Pending.</text>
</svg>
